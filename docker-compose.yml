services:

  flask-api:
    build: .
    container_name: flask5
    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres-db:5432/flask_db

    depends_on:
      - postgres-db

  postgres-db:
    image: postgres:17
    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flask_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


volumes:
  postgres_data: